<html>
	<head>
		<title>tables</title>

	<body style='background-color:powderblue'>
	<table border='1' style='background-color:orange;color:blue'>
	<caption style='color:pink;font-size:15px'>column-span</caption>
	<tr>
		<th>name</th>
		<th colspan='2'>phone</th>
	</tr>
	<tr>
		<td>bill gates</td>

	</tr>
	</table>
	<hr/>
	<table border='1' style='background-color:silver;color:maroon'>
	<caption style='color:pink;font-size:15px'>row-span</caption>
	<tr>
		<th>name</th>
		<td>bill gates</td>
	</tr>
	<tr>
		<th rowspan='2'>phone</th>
		<td>5226846939</td>
	</tr>
	<tr>
		<td>5226831258</td>
	</tr>
	</body>
</html>
